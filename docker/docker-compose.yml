services:
  # The application you want to monitor
  observer-test-app:
    container_name: observer-test-app
    build:
      context: .
      dockerfile: app.Dockerfile
    ports:
      - 8081:80
    stdin_open: true
    tty: true
    
  # Your Go process monitoring sidecar
  orthanc-observer:
    build:
      context: ../client/observer
      dockerfile: ../../docker/observer.Dockerfile
    pid: "service:observer-test-app"
    # Needed to load BPF programs and attach tracepoints (kernel 5.8+).
    # On older kernels, replace with `privileged: true`.
    cap_add:
      - BPF
      - PERFMON
    depends_on:
      - observer-test-app
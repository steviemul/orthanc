services:
  # Your Go process monitoring sidecar.
  # This is the PID namespace anchor: observer-test-app and event-collector
  # both join it below so orthanc-observer can see processes from either.
  # (In production you'd scope one observer per target instead.)
  orthanc-observer:
    build:
      context: ../client/observer
      dockerfile: ../../docker/observer.Dockerfile
    # Needed to load BPF programs and attach tracepoints (kernel 5.8+).
    # On older kernels, replace with `privileged: true`.
    cap_add:
      - BPF
      - PERFMON
    # Tracepoint attachment reads the tracefs/debugfs event format files.
    # Docker gives containers a fresh sysfs mount, so the host's debugfs
    # submount isn't visible inside without this bind mount.
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug:rw

  # The application you want to monitor
  observer-test-app:
    container_name: observer-test-app
    build:
      context: .
      dockerfile: app.Dockerfile
    ports:
      - 8081:80
    stdin_open: true
    tty: true
    pid: "service:orthanc-observer"
    depends_on:
      - orthanc-observer

  # Server side event collector
  event-collector:
    container_name: event-collector
    build:
      context: ../server/event-collector
      dockerfile: Dockerfile
    ports:
      - 8082:8080
    pid: "service:orthanc-observer"
    depends_on:
      - orthanc-observer